[project]
name = "nfa"
version = "0.0.1"
description = "NBA Fantasy Assistant"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "keyring>=25",
    "pandas>=2.2",
    "pyarrow>=16",
    "nba_api>=1.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380", "types-requests"]
spike = ["pdfplumber>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["*.md"]  # docs hold illustrative code blocks

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # the formatter handles length; long strings and URLs are fine

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
